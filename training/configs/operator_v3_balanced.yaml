# Experiment A — Balanced Training Mixture (Production Dataset)
#
# Purpose: General operator behavior improvement.
# This is the DEFAULT mixture for the first v3 training run.
#
# Dataset: adaptive_operator_dataset_v1 (production, 2,651 examples)
# Training guide: metadata/TRAINING_GUIDE.md recommends LoRA rank 64, 3 epochs

experiment:
  name: "operator_v3_balanced"
  description: "Balanced mixture for general operator behavior (production dataset)"
  priority: 1  # run this first

base_model:
  name: "Qwen/Qwen3.5-9B"
  provider: "together_ai"
  context_length: 32768

method:
  type: "lora"
  rank: 64  # TRAINING_GUIDE recommends 64 for behavioral learning
  alpha: 128  # 2x rank (standard practice)
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# Dataset mixture — using production category files directly
# The SFT file is a superset, so we use category-specific files for mixing
mixture:
  # Engineering trajectories — the core
  sft:
    weight: 0.40
    source: "datasets/incoming/adaptive_operator_dataset_v1/sft/train.jsonl"
    format: "sft"
    max_samples: 2297

  # Tool use — teach effective tool selection
  tools:
    weight: 0.20
    source: "datasets/incoming/adaptive_operator_dataset_v1/tools/train.jsonl"
    format: "sft"
    max_samples: 572

  # Compute policy — adaptive compute routing
  compute_policy:
    weight: 0.15
    source: "datasets/incoming/adaptive_operator_dataset_v1/compute_policy/train.jsonl"
    format: "sft"
    max_samples: 983

  # Recovery — failure recovery
  recovery:
    weight: 0.10
    source: "datasets/incoming/adaptive_operator_dataset_v1/recovery/train.jsonl"
    format: "sft"
    max_samples: 189

  # Architecture — deliberate design
  architecture:
    weight: 0.10
    source: "datasets/incoming/adaptive_operator_dataset_v1/architecture/train.jsonl"
    format: "sft"
    max_samples: 330

  # Evaluation held-out (NOT used in training)
  # evaluation/test.jsonl is reserved for evaluation only

# Training hyperparameters (from TRAINING_GUIDE.md)
training:
  epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4  # effective batch 16
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  lr_scheduler: "cosine"
  max_seq_length: 4096
  weight_decay: 0.01
  max_grad_norm: 1.0
  early_stopping_patience: 3

# Evaluation
evaluation:
  eval_steps: 50
  eval_dataset: "datasets/incoming/adaptive_operator_dataset_v1/evaluation/test.jsonl"
  harness_dir: "eval/operator_v3/"
  categories: [tool_competence, recovery, planning, compute_allocation]
  min_pass_rate:
    tool_competence: 0.80
    recovery: 0.60
    planning: 0.70
    compute_allocation: 0.75

# Output
output:
  adapter_dir: "models/adaptive-operator-v3/checkpoints/balanced/"
  merged_model_dir: "models/adaptive-operator-v3/merged/balanced/"
  mlx_model_dir: "models/adaptive-operator-v3/mlx/balanced/"
  mlx_quantization: "4bit"
  final_name: "Qwen3.5-9B-Adaptive-Operator-v3-Balanced-MLX-4bit"

seed: 42
