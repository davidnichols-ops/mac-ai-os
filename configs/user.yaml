# Machine-specific overrides for this host (16 GB RAM, 47 GB free disk).
#
# Disk space is now sufficient for the spec's target planner model (Qwen3 14B 4bit, ~8 GB).
# The utility model stays small (Llama 3.2 3B) to avoid loading two large models simultaneously.

planner:
  provider: mlx
  model: mlx-community/Qwen3-14B-4bit
  temperature: 0.7
  max_tokens: 1024

utility:
  provider: mlx
  model: mlx-community/Llama-3.2-3B-Instruct-4bit
  temperature: 0.4
  max_tokens: 256

embeddings:
  provider: chroma_default
  collection: mac-ai-os
  persist_dir: data/embeddings
