# Machine-specific overrides for this host (16 GB RAM, M4).
#
# Planner: Nemotron-Nano-9B-v2-4bit — 5.3 GB, 128K context, hybrid Mamba-2
# architecture, reasoning traces. Better memory/speed than Qwen3-14B on 16GB.
# Utility: Llama-3.2-3B stays small to avoid loading two large models at once.

planner:
  provider: mlx
  model: mlx-community/NVIDIA-Nemotron-Nano-9B-v2-4bits
  temperature: 0.7
  max_tokens: 1024

utility:
  provider: mlx
  model: mlx-community/Llama-3.2-3B-Instruct-4bit
  temperature: 0.4
  max_tokens: 256

embeddings:
  provider: chroma_default
  collection: mac-ai-os
  persist_dir: data/embeddings
