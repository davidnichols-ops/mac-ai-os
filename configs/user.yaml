# Machine-specific overrides for this host (16 GB RAM, ~14 GB free disk).
#
# configs/default.yaml keeps the spec's target models (Qwen3 14B, gemma3 4b).
# This file overrides them with smaller MLX models so the Phase-1 milestone
# runs without filling the disk. On a machine with >= 32 GB RAM and ample disk,
# delete this file (or copy configs/example.yaml here) to use the full models.

planner:
  provider: mlx
  model: mlx-community/Llama-3.2-3B-Instruct-4bit
  temperature: 0.7
  max_tokens: 512

utility:
  provider: mlx
  model: mlx-community/Llama-3.2-3B-Instruct-4bit
  temperature: 0.4
  max_tokens: 256

embeddings:
  provider: chroma_default
  collection: mac-ai-os
  persist_dir: data/embeddings
