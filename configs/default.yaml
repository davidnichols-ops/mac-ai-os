# Mac AI OS — default configuration.
# Do not edit; override by creating configs/user.yaml or passing a custom path.

planner:
  provider: mlx
  model: ""            # auto-selected from hardware if empty
  temperature: 0.7
  max_tokens: 1024

utility:
  provider: mlx
  model: ""            # auto-selected from hardware if empty
  temperature: 0.4
  max_tokens: 512

embeddings:
  # mlx-lm has no embed() API, so the working local default is chroma_default
  # (ONNX all-MiniLM-L6-v2, ~80MB, no torch, no ollama). Switch to `ollama`
  # (nomic-embed-text) or `mlx` (requires a future mlx-embeddings package).
  provider: chroma_default
  model: ""            # unused by chroma_default; auto-selected otherwise
  collection: mac-ai-os
  persist_dir: data/embeddings

retrieval:
  backend: chroma      # chroma (future: lancedb, qdrant, pgvector)
  top_k: 5
  chunk_size: 800
  chunk_overlap: 120

telemetry:
  enabled: true
  interval_seconds: 5.0

ollama:
  base_url: http://localhost:11434
  auto_start: true
  startup_timeout_seconds: 30.0

logging:
  level: INFO
  json_logs: false
  log_dir: logs

paths:
  data_dir: data
  models_dir: models
  logs_dir: logs
