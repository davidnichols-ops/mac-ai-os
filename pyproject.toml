[project]
name = "mac-ai-os"
version = "0.2.0"
description = "A local-first AI operating system for macOS — an intelligence layer over the computer."
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Mac AI OS contributors" }]
license = { text = "MIT" }
keywords = ["ai", "agent", "macos", "mcp", "local-first", "operating-system"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer>=0.12.3",
    "rich>=13.7",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "chromadb>=0.5.3",
    "psutil>=5.9",
    "pypdf>=4.0",
    "ollama>=0.3.0",
    # mlx-lm is Apple-Silicon only; on other platforms it won't resolve.
    # We import it lazily so the project still imports off-Apple for tests.
    "watchdog>=6.0.0",
    "mcp>=1.27,<2",
    "openai>=1.0",
    "hf-xet>=1.5.2",
    "slack-sdk>=3.43.0",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.20.0"]
slack = [
    "slack_bolt>=1.18.0",
    "slack_sdk>=3.20.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
mac-ai-os = "app.cli.app:run"
maos = "app.cli.app:run"
app = "app.cli.app:run"

[project.urls]
Repository = "https://github.com/davidnichols-ops/mac-ai-os"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "configs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "slow: slow-running stress tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
